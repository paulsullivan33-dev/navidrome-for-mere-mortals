site_name: Navidrome for Mere Mortals
site_description: Plain-language self-hosted music streaming with your own library on your own machine. One small program, your folders of songs, listening in the browser and in Subsonic apps, playlists, extra users, backups that restore, and upgrades that swap one file.
site_url: https://paulsullivan33-dev.github.io/navidrome-for-mere-mortals/

